# Every push and pull request must pass the same gate as a local release:
# corpus and question validators, all tests, the typecheck, a full static build,
# and then the two checks that only a finished build can answer: whether the
# build products are still in step with their sources, and whether every link,
# colour token and feed in the shipped site actually resolves.
name: Verify & Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    # The spatial gate loads every (route, width) fresh, on a real clock, so
    # that what it measures is what a reader gets. That is minutes, not
    # seconds, and a timeout that kills the job is a gate that protects
    # nothing — so the budget has to cover the honest cost.
    #
    # The honest cost, measured: the sweep is 43 routes x 58 widths = 2494
    # fresh page loads, and it takes about 70 minutes on a clean runner. The
    # other gates in this job take about 25. A 75-minute budget killed the
    # sweep before it finished, every time, and a job that dies at the last
    # step is a job that reports nothing. So the budget is 150: enough for
    # the sweep with room for a slow runner, and still short enough that a
    # hung gate is killed rather than billing for hours.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      # The build regenerates data/*.json. If those changed, the commit that
      # triggered this run shipped indexes that do not match their sources.
      - run: node scripts/check-generated.mjs
      # Undefined CSS vars, per-class WCAG contrast, and link integrity across
      # every built page, the sitemap and all three podcast feeds.
      - run: npm run check:release
      # Non-Slop anti-slop laws: default fonts, purple gradients, glass, card
      # kits, centred heroes, hype copy, emoji icons, missing alt text, missing
      # viewport, unlabelled <html>, motion with no reduced-motion path. Without
      # this step the scanner is a directory on disk that nobody runs.
      - run: npm run check:slop
      # Rendered-browser gates: horizontal overflow, all-zero progress readouts
      # and empty labelled regions across every route at five widths. Needs the
      # post-build out/, so it cannot run before check:release.
      - run: npm run check:layout
      # Hierarchy gate: one title per page, the title wins over every other
      # size on the page, and no page lets a wall of identical cards compete
      # with itself for the reader's attention.
      - run: npm run check:hierarchy
      # Sentence gate: no question, choice, explanation or rule is written as
      # one long compound sentence — in English, Chinese or Thai. It was in the
      # local release chain only, which meant a pull request could merge a
      # page of run-ons while every CI job was green.
      - run: npm run check:sentences
      # Data-integrity gate: no question, choice, explanation or rule may lose a
      # number, a section reference or a modal verb. The baseline is the review
      # surface — a pull request that moves a fact has to move the baseline too,
      # and the diff says which fact moved.
      - run: npm run check:data
      # The spatial instrument must be the canonical one. A copy that drifted is
      # a copy that measures something else, and a number that means one thing
      # in one project and another thing in the next is a false guarantee.
      - run: npm run check:spatial-sync
      # Spatial gate: every unjustified gap, orphan, scattered pair, accidental
      # wrap and clipped row on every route is either fixed or carries a
      # written reason in the baseline. The sweep is the project's widths plus
      # every breakpoint the CSS declares and the pixel on either side of it —
      # a fix written at a breakpoint the gate never sweeps is a fix nobody
      # checked, and that is how three of them were broken in the first place.
      # A hole with no reason is a hole nobody chose, so it fails until
      # somebody writes one down.
      - run: npm run check:spatial

  # A gate that has never failed proves nothing. This job injects one real
  # violation per hierarchy rule into the built site and requires the gate to
  # catch each one. It rebuilds twice, so it runs on main pushes rather than on
  # every pull request.
  falsify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # This job's budget has to cover the falsifier's OWN budget, or the outer
    # ceiling kills the run before the inner one can report. The falsifier
    # gives its full-estate sweep 45 minutes (43 routes x 3 widths, every one
    # loaded fresh), so the job needs that, plus the install and the build,
    # plus room for a slow runner. It was 60 minutes, which was more than the
    # falsifier's budget but not much more, and not enough for the install
    # and the build on a slow runner — so the room was thin, and a job
    # killed mid-sweep reports nothing. Same defect the verify job had at 75.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run falsify:hierarchy
      # The spatial gate gets the same treatment: one real defect per mode of
      # spatial hallucination is injected into a copy of the built site, and
      # the gate has to catch every one of them.
      - run: npm run falsify:spatial