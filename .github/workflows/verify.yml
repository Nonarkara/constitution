# Every push and pull request must pass the same gate as a local release:
# corpus and question validators, all tests, the typecheck, a full static build,
# and then the two checks that only a finished build can answer: whether the
# build products are still in step with their sources, and whether every link,
# colour token and feed in the shipped site actually resolves.
name: Verify & Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      # The build regenerates data/*.json. If those changed, the commit that
      # triggered this run shipped indexes that do not match their sources.
      - run: node scripts/check-generated.mjs
      # Undefined CSS vars, per-class WCAG contrast, and link integrity across
      # every built page, the sitemap and all three podcast feeds.
      - run: npm run check:release
      # Non-Slop anti-slop laws: default fonts, purple gradients, glass, card
      # kits, centred heroes, hype copy, emoji icons, missing alt text, missing
      # viewport, unlabelled <html>, motion with no reduced-motion path. Without
      # this step the scanner is a directory on disk that nobody runs.
      - run: npm run check:slop
      # Rendered-browser gates: horizontal overflow, all-zero progress readouts
      # and empty labelled regions across every route at five widths. Needs the
      # post-build out/, so it cannot run before check:release.
      - run: npm run check:layout